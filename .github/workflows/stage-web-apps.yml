# Installed from docs/deploy/stage-web-apps-pr.yml (see docs/deploy.md).
#
# On every push to main (or when run by hand): builds the single-file page, stages it into a checkout of
# johnjp15/web-apps with tools/stage-web-apps.sh (cs2/sim/index.html, plus the list card and README row the first
# time) and opens a pull request there, or updates the open one. Nothing is published until John merges it; the
# merge triggers web-apps' cs2 deploy workflow (docs/deploy/web-apps-deploy.yml).
#
# Repository secret (cs2-round-replay → Settings → Secrets and variables → Actions → New repository secret):
#   WEB_APPS_TOKEN  a fine-grained personal access token: resource owner johnjp15, repository access "Only select
#                   repositories" → johnjp15/web-apps, repository permissions Contents: Read and write and
#                   Pull requests: Read and write (Metadata: Read-only is added by GitHub). Nothing else.
#
# No password is involved: the PR carries the plaintext page into the private web-apps repo, as a manual stage would.
name: Stage the sim in web-apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-web-apps
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The bot's own branch in web-apps: always web-apps main plus one commit with the latest build.
      BRANCH: cs2-round-replay/sim
    steps:
      # Until John adds the secret, skip with a warning instead of failing every push to main.
      - name: Check the secret
        id: secret
        env:
          WEB_APPS_TOKEN: ${{ secrets.WEB_APPS_TOKEN }}
        run: |
          if [ -n "$WEB_APPS_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::WEB_APPS_TOKEN is not set; skipping the web-apps stage (docs/deploy.md)."; fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          path: cs2-round-replay
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          repository: johnjp15/web-apps
          ref: main
          path: web-apps
          token: ${{ secrets.WEB_APPS_TOKEN }}

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cs2-round-replay/package-lock.json

      - run: npm ci
        if: steps.secret.outputs.ok == 'true'
        working-directory: cs2-round-replay

      - name: Build and stage
        if: steps.secret.outputs.ok == 'true'
        run: cs2-round-replay/tools/stage-web-apps.sh web-apps

      - name: Open or update the pull request
        if: steps.secret.outputs.ok == 'true'
        working-directory: web-apps
        env:
          GH_TOKEN: ${{ secrets.WEB_APPS_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          git add -A cs2
          if git diff --cached --quiet; then echo "web-apps main already has this build."; exit 0; fi
          short="${SHA::7}"
          git switch -c "$BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "cs2/sim: build of cs2-round-replay@$short"
          git push --force origin "$BRANCH"
          title="cs2/sim: cs2-round-replay@$short"
          body="Built by tools/stage-web-apps.sh from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$SHA. Merging it deploys the cs2 pages (web-apps' cs2 deploy workflow)."
          pr="$(gh pr list --repo johnjp15/web-apps --head "$BRANCH" --state open --json number --jq '.[].number')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo johnjp15/web-apps --title "$title" --body "$body"
          else
            gh pr create --repo johnjp15/web-apps --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
