name: CI

# Actions minutes are limited (private repo): docs-only changes don't run CI, and a newer push to the
# same PR or branch cancels the run still in progress.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'NOTES.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'NOTES.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # H3: Mirage rebuilt through the generic map builder must be byte-identical (mesh, clips, height image, nav, facts).
      - run: npm run map:check
      - run: npm run build
      - run: npm run build:single
      # Demo coach page (K0).
      - run: npm run build:coach
