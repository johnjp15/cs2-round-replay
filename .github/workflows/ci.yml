name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # H3: Mirage rebuilt through the generic map builder must be byte-identical (mesh, clips, height image, nav, facts).
      - run: npm run map:check
      - run: npm run build
      - run: npm run build:single
