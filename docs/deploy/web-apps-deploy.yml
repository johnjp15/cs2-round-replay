# DRAFT for the web-apps repo: install as web-apps/.github/workflows/cs2-deploy.yml (cs2-round-replay docs/deploy.md).
#
# On a push to main that touches cs2/ (or when run by hand), encrypts the cs2 pages with cs2/tools/deploy.sh and
# pushes them to johnjp15/johnjp15.github.io (branch master), which GitHub Pages serves.
#
# Repository secrets (web-apps → Settings → Secrets and variables → Actions → New repository secret):
#   CS2_PASSWORD  the cs2 password. It must be the one cs2/tools/lock.json's verifier was made with, or
#                 encrypt.cjs refuses and nothing is published.
#   PAGES_TOKEN   a fine-grained personal access token: resource owner johnjp15, repository access "Only select
#                 repositories" → johnjp15/johnjp15.github.io, repository permissions Contents: Read and write
#                 (Metadata: Read-only is added by GitHub). Nothing else.
#
# A password change is never made here: run `CS2_NEW_PASSWORD=1 cs2/tools/deploy.sh` locally, commit
# cs2/tools/lock.json, then update the CS2_PASSWORD secret. This workflow fails if lock.json would change.
name: Deploy cs2 pages

on:
  push:
    branches: [main]
    paths: ['cs2/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs2-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the secrets
        env:
          CS2_PASSWORD: ${{ secrets.CS2_PASSWORD }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          [ -n "$CS2_PASSWORD" ] || { echo "::error::Add the CS2_PASSWORD repository secret."; exit 1; }
          [ -n "$PAGES_TOKEN" ] || { echo "::error::Add the PAGES_TOKEN repository secret."; exit 1; }

      - uses: actions/checkout@v4
        with:
          path: web-apps
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: johnjp15/johnjp15.github.io
          ref: master
          path: johnjp15.github.io
          token: ${{ secrets.PAGES_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # deploy.sh encrypts into a temp dir, refuses if a plaintext marker survives, then replaces
      # johnjp15.github.io/cs2/ with the result. The password reaches only this step, from the secret.
      - name: Encrypt the cs2 pages
        env:
          CS2_PASSWORD: ${{ secrets.CS2_PASSWORD }}
        run: web-apps/cs2/tools/deploy.sh "$GITHUB_WORKSPACE/johnjp15.github.io"

      # encrypt.cjs rewrites lock.json; with the current password it comes out byte for byte the same.
      - name: Refuse a new salt or verifier
        run: git -C web-apps diff --exit-code -- cs2/tools/lock.json

      - name: Commit and push to GitHub Pages
        working-directory: johnjp15.github.io
        run: |
          git add -A cs2
          if git diff --cached --quiet; then echo "Nothing to publish."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "cs2: deploy web-apps@${GITHUB_SHA::7}"
          git push origin HEAD:master
