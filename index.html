<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>CS2 round replay — 2D Mirage</title>
    <style>
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --btn: #21262d;
        --btn-hover: #30363d;
        --on: #1f6feb;
        --border: #30363d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); }
      body { font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
      }
      #stage { position: relative; flex: 1 1 auto; min-height: 0; }
      #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #status {
        position: absolute; inset: 0; margin: 0; padding: 1rem;
        display: flex; align-items: center; justify-content: center; text-align: center;
        pointer-events: none; font-size: 16px;
      }
      #status[hidden] { display: none; }
      #controls {
        flex: 0 0 auto;
        display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--border);
      }
      button {
        font: inherit; color: var(--fg); background: var(--btn);
        border: 1px solid var(--border); border-radius: 6px;
        padding: 7px 10px; min-height: 36px;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      @media (hover: hover) { button:hover:not(:disabled) { background: var(--btn-hover); } }
      button[aria-pressed="true"] { background: var(--on); border-color: var(--on); }
      button:disabled { opacity: 0.45; cursor: default; }
      .group { display: inline-flex; }
      .group button { border-radius: 0; margin-left: -1px; min-width: 2.75rem; }
      .group button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
      .group button:last-child { border-radius: 0 6px 6px 0; }
      #help { flex-basis: 100%; margin: 0; text-align: center; font-size: 12px; opacity: 0.7; }
      @media (hover: none) { #help { display: none; } }
      @media (max-width: 430px) {
        body { font-size: 13px; }
        button { padding: 6px 8px; }
        #controls { gap: 5px; }
      }
      /* Phones in landscape: controls in a column on the right, so the map keeps the height. */
      @media (orientation: landscape) and (max-height: 540px) {
        #app { flex-direction: row; padding-bottom: env(safe-area-inset-bottom); }
        #controls {
          flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; align-items: stretch;
          width: 11.5rem; overflow-y: auto; border-top: 0; border-left: 1px solid var(--border); padding: 8px;
        }
        .group { display: flex; }
        .group button { flex: 1 1 0; min-width: 0; padding-left: 2px; padding-right: 2px; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <canvas id="view" aria-label="Map of the round"></canvas>
        <p id="status" role="status">Loading round…</p>
      </div>
      <div id="controls" role="toolbar" aria-label="Replay controls">
        <button id="start" type="button" disabled>Start</button>
        <button id="pause" type="button" disabled>Pause</button>
        <button id="restart" type="button" disabled>Restart</button>
        <span class="group" role="group" aria-label="Speed">
          <button type="button" data-speed="0.25" aria-pressed="false">0.25×</button>
          <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="2" aria-pressed="false">2×</button>
          <button type="button" data-speed="4" aria-pressed="false">4×</button>
        </span>
        <button id="spectate" type="button" aria-pressed="false">Spectate (no human)</button>
        <button id="dl-log" type="button">Download log (JSONL)</button>
        <button id="dl-trace" type="button">Download trace (JSON)</button>
        <p id="help">You play cart: WASD move (W = up on the map) · mouse aims · click fires · Shift walk · Ctrl/C crouch · R reload · E use · 1–5 weapons</p>
      </div>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
